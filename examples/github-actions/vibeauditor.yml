name: vibeAuditor

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run vibeAuditor
        run: PYTHONPATH=src python3 -m vibeauditor . --fail-on high --no-color
